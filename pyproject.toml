[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "protor"
version = "2.9.0"
description = "AI-powered web scraper and analyzer — async, offline-friendly, Ollama-backed"
readme = "README.md"
license = "MIT"
authors = [{ name = "Pulkit", email = "work.pulkitpareek@gmail.com" }]
requires-python = ">=3.11"
keywords = ["web-scraper", "cli", "ollama", "ai", "crawler"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Utilities",
]
dependencies = [
    "aiohttp>=3.9",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "packaging>=21",
    "requests>=2.31",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "responses>=0.25",
    "types-requests>=2.31",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.18"]
all-llms = ["protor[openai,anthropic]"]

[project.urls]
Homepage = "https://wtfpulkit.dev"
Repository = "https://github.com/pulkit777exe/protor"
Issues = "https://github.com/pulkit777exe/protor/issues"
Changelog = "https://github.com/pulkit777exe/protor/blob/main/CHANGELOG.md"

[project.scripts]
protor = "protor.cli:cli"

# ── setuptools ───────────────────────────────────────────────────────────────
[tool.setuptools.packages.find]
where = ["."]
include = ["protor*"]

# ── pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    # Benchmark-gate tests take minutes and assert on timings, which is a poor
    # default: slow, and flaky under load. Run them with `pytest -m slow`, or
    # exercise the same gate directly with `python -m benchmarks --gate`.
    "-m",
    "not slow",
    "--cov=protor",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=75",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: opens a socket (loopback only; no outbound network needed)",
    "ollama: marks tests that require a running Ollama instance",
    "asyncio: marks tests that use asyncio",
]

# ── ruff (lint + format) ─────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["protor", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "SIM",      # flake8-simplify
    "TCH",      # flake8-type-checking
    "RUF",      # ruff-specific
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["protor"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
# Strict, deliberately. It was false while the codebase carried bare `dict`/`list`
# annotations that said nothing; turning it on surfaced a variance bug in the CLI
# (a helper returning manifests-or-dicts annotated to accept only dicts) that the
# loose mode could not see. Keep it strict — `mypy protor` is the gate.
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["tests/"]

# ── coverage ─────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["protor"]
omit = ["protor/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]