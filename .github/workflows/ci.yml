name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # Pinned rather than `ubuntu-latest`: on 2026-10-19 that label starts
    # resolving to Ubuntu 26, which would change the OS underneath a release
    # path we depend on without anyone choosing to. Pinning keeps CI
    # reproducible and defers the bump to a deliberate, visible change.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check && ruff format --check

      - name: Type check with mypy
        # The benchmark harness is type-checked too: it reads protor's internals
        # directly, so a signature change breaks it, and a silently mistyped
        # call would corrupt the very numbers the gate compares.
        run: mypy protor/ benchmarks/

      - name: Run tests
        # `not slow` skips tests that assert on real timings; the benchmark job
        # below exercises that code path properly instead.
        run: pytest -m "not integration and not ollama and not slow" --tb=short

      - name: Run integration tests
        # These open a socket, but only to loopback: the LLM wire tests run a
        # real HTTP server in-process, so they need no outbound network and no
        # secrets. They are the only coverage of the streaming path against a
        # real connection, so they run on every push rather than being left to
        # a maintainer with a local runtime.
        run: pytest -m "integration and not ollama" --tb=short --no-cov

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: htmlcov/

  # Timing needs a quiet machine, so it is a separate single-version job
  # rather than competing with the test matrix for CPU. Uploaded as an
  # artifact and compared against the recorded baseline, so a change that
  # quietly reintroduces a per-page full-document scan shows up as a failed
  # step instead of a number nobody reads.
  benchmark:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Measure hot paths
        run: python -m benchmarks --json bench.json --repeats 7

      - name: Fail if any hot path became superlinear
        # The gate is the scaling ratio, not an absolute timing. Absolute
        # timings are not comparable across machines -- the first CI run of this
        # suite reported every case 1.6-1.7x slower than a locally recorded
        # baseline with no code change -- and they are not even stable on one
        # machine: three runs of identical code gave 69.1ms, 69.4ms and 92.7ms
        # for parse_html. The scaling ratio is measured within a single run, so
        # both effects cancel, and superlinear growth is what actually turns a
        # large crawl slow. Recorded baselines are still uploaded for inspection.
        run: python -m benchmarks --gate

      - name: Compare against the recorded baseline
        # Informational, not enforced, for the reasons above.
        run: python -m benchmarks --check benchmarks/baseline.json || true

      - name: Upload benchmark measurements
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-report
          path: bench.json

  # Everything else in this suite either stubs HTTP or talks to a server the test
  # itself started. Both are useful; neither can tell you whether a real runtime
  # works, because a stub decides where SSE lines begin and a hand-written server
  # reproduces the wire format as its author understood it. This job is the only
  # place protor talks to an actual Ollama.
  real-llm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama
        run: |
          ollama serve &
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:11434/api/tags >/dev/null; then exit 0; fi
            sleep 1
          done
          echo "Ollama did not become ready" >&2
          exit 1

      - name: Pull a small chat model
        # qwen2.5:0.5b is ~400 MB: enough for a real round trip, cheap enough to
        # pull on every push. A larger model would only make the job slower
        # without testing anything the smaller one does not.
        run: ollama pull qwen2.5:0.5b

      - name: Run against the real runtime
        run: pytest -m ollama --tb=short --no-cov
